<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420">
<style>
  .mono{font-family:'Courier New',Consolas,monospace;font-size:17px;fill:#c9d1d9;white-space:pre}
  .ok{fill:#3fb950;font-weight:bold}
  .warn{fill:#d29922;font-weight:bold}
  .err{fill:#f85149;font-weight:bold}
  .pr{fill:#bc8cff;font-weight:bold}
  .cover{fill:#0d1117;animation:type 0.9s steps(34) forwards}
  @keyframes type{to{transform:translateX(740px)}}

  #win{animation:shake .45s 6.1s 1}
  @keyframes shake{0%,100%{transform:translate(0,0)}20%{transform:translate(-8px,3px)}40%{transform:translate(7px,-4px)}60%{transform:translate(-5px,2px)}80%{transform:translate(4px,-1px)}}

  #redflash{opacity:0;animation:flash .5s 6.1s 1}
  @keyframes flash{0%{opacity:0}30%{opacity:.35}100%{opacity:0}}

  #bar{transform-box:fill-box;transform-origin:left;transform:scaleX(0);animation:fill 2.2s 7s cubic-bezier(.7,0,.3,1) forwards}
  @keyframes fill{to{transform:scaleX(1)}}

  #term{animation:out .4s 9.7s forwards}
  @keyframes out{to{opacity:0}}

  .appear{opacity:0;animation:in .15s forwards}
  @keyframes in{to{opacity:1}}

  #title{opacity:0;animation:in .2s 10.1s forwards}
  .gc{animation:g1 1.6s steps(1) 10.1s infinite}
  .gm{animation:g2 1.3s steps(1) 10.1s infinite}
  .gw{animation:g3 2.4s steps(1) 10.1s infinite}
  @keyframes g1{0%{transform:translate(-4px,0)}15%{transform:translate(5px,-2px)}30%{transform:translate(-2px,2px)}45%{transform:translate(-6px,0)}60%{transform:translate(3px,1px)}75%{transform:translate(-3px,-1px)}90%{transform:translate(1px,0)}}
  @keyframes g2{0%{transform:translate(4px,0)}20%{transform:translate(-5px,2px)}40%{transform:translate(3px,-2px)}55%{transform:translate(6px,1px)}70%{transform:translate(-2px,0)}85%{transform:translate(2px,-1px)}}
  @keyframes g3{0%,88%{transform:translate(0,0)}90%{transform:translate(-3px,0) skewX(-12deg)}93%{transform:translate(4px,0) skewX(10deg)}96%{transform:translate(0,0)}}

  #sub{opacity:0;animation:in .3s 10.8s forwards}
  .blink{animation:bl 1s steps(1) infinite}
  @keyframes bl{50%{opacity:0}}
  #cur{opacity:0;animation:in .1s 10.8s forwards}
</style>

<defs>
  <linearGradient id="g" x1="0" x2="1">
    <stop offset="0" stop-color="#7f00ff"/><stop offset="1" stop-color="#e100ff"/>
  </linearGradient>
  <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
    <rect width="4" height="1" fill="#ffffff" opacity=".035"/>
  </pattern>
</defs>

<g id="win">
  <rect x="10" y="10" width="780" height="400" rx="14" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <path d="M10 24a14 14 0 0 1 14-14h752a14 14 0 0 1 14 14v22H10z" fill="#161b22"/>
  <circle cx="34" cy="28" r="6.5" fill="#ff5f56"/><circle cx="56" cy="28" r="6.5" fill="#ffbd2e"/><circle cx="78" cy="28" r="6.5" fill="#27c93f"/>
  <text x="400" y="33" text-anchor="middle" class="mono" style="font-size:13px;fill:#8b949e">nerea@poufortnite: ~</text>

  <g id="term">
    <text x="40" y="82" class="mono"><tspan class="pr">$</tspan> sudo ./nerea.exe --modo-epico</text>
    <rect class="cover" x="40" y="64" width="740" height="24" style="animation-delay:.4s"/>

    <text x="40" y="112" class="mono"><tspan class="ok">[  OK  ]</tspan> Inyectando Monster en vena...</text>
    <rect class="cover" x="40" y="94" width="740" height="24" style="animation-delay:1.5s"/>

    <text x="40" y="142" class="mono"><tspan class="ok">[  OK  ]</tspan> Abriendo 47 pestanas de Stack Overflow</text>
    <rect class="cover" x="40" y="124" width="740" height="24" style="animation-delay:2.6s"/>

    <text x="40" y="172" class="mono"><tspan class="warn">[ WARN ]</tspan> Horas de sueno: 404 not found</text>
    <rect class="cover" x="40" y="154" width="740" height="24" style="animation-delay:3.7s"/>

    <text x="40" y="202" class="mono"><tspan class="ok">[  OK  ]</tspan> Hackeando la NASA... (es broma) (o no)</text>
    <rect class="cover" x="40" y="184" width="740" height="24" style="animation-delay:4.8s"/>

    <text x="40" y="232" class="mono"><tspan class="err">[ERROR!]</tspan> DEMASIADO TALENTO DETECTADO</text>
    <rect class="cover" x="40" y="214" width="740" height="24" style="animation-delay:5.6s;animation-duration:.5s"/>

    <text x="40" y="272" class="mono appear" style="animation-delay:6.7s">Instalando personalidad...</text>
    <rect x="40" y="284" width="720" height="16" rx="8" fill="#21262d" class="appear" style="animation-delay:6.7s"/>
    <rect id="bar" x="40" y="284" width="720" height="16" rx="8" fill="url(#g)"/>
    <text x="40" y="330" class="mono appear" style="animation-delay:9.2s"><tspan class="ok">ACCESS GRANTED.</tspan> Preparate.</text>
  </g>

  <g id="title" text-anchor="middle" style="font-family:'Arial Black',Impact,sans-serif;font-size:104px;font-weight:900;letter-spacing:6px">
    <text x="400" y="240" fill="#00f0ff" opacity=".85" class="gc">NEREA</text>
    <text x="400" y="240" fill="#ff00c8" opacity=".85" class="gm">NEREA</text>
    <text x="400" y="240" fill="#ffffff" class="gw">NEREA</text>
  </g>
  <text id="sub" x="400" y="300" text-anchor="middle" class="mono" style="font-size:19px;fill:#bc8cff">ongi etorri · no toques nada</text>
  <g id="cur"><rect x="392" y="320" width="16" height="4" fill="#bc8cff" class="blink"/></g>

  <rect x="10" y="46" width="780" height="364" fill="url(#scan)" pointer-events="none"/>
  <rect id="redflash" x="10" y="10" width="780" height="400" rx="14" fill="#f85149"/>
</g>
</svg>
